name: Build

# Manual only: nothing runs on push or pull request. Start it from the Actions tab ("Run workflow")
# when you want a clean-machine build + test run, or a release. Locally: build.bat and
# tests\build_tests.bat do the same.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.7.16, no v). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write      # the release
  id-token: write      # build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "version must look like 1.7.16"; exit 1; fi
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The same script as a local release (tools\release.ps1 -DryRun): the plugin built as a release
      # (/DMWT_VERSION, no test commands) and dist\MWTogether-<version>-notes.md (download link; the
      # changelog is generated by the release). The zip does not include Ultimate ASI Loader (a separate
      # required download).
      - name: Build and package
        shell: pwsh
        run: tools/release.ps1 -Version "${{ steps.ver.outputs.version }}" -DryRun

      # Unit, regression and fuzz tests (no game needed): /RTC1 build, then AddressSanitizer if the
      # toolset has it for x86 (the script skips that part with a note otherwise).
      - name: Tests
        shell: cmd
        run: tests\build_tests.bat

      # MSVC /analyze over the plugin sources. Report only: it never fails the run.
      - name: Static analysis (report only)
        shell: cmd
        continue-on-error: true
        run: tests\build_tests.bat analyze

      # The dev build (test commands, netsim, boot automation: MWT_DEVTOOLS) never ships, but must still
      # compile. Built after packaging, so it doesn't replace the release ASI in dist.
      - name: Dev build (compile check)
        shell: cmd
        run: build.bat

      - name: SHA256
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          foreach ($f in "dist/MWTogether-$v.zip", "dist/MWTogether-$v/scripts/MWTogether.asi") {
            "$(Split-Path $f -Leaf) SHA256 $((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # Signed build provenance (Sigstore): anyone can check a file came from this workflow and commit with
      # gh attestation verify <file> --repo StCost/nfs-most-wanted-together
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/MWTogether-${{ steps.ver.outputs.version }}.zip
            dist/MWTogether-${{ steps.ver.outputs.version }}/scripts/MWTogether.asi

      - uses: actions/upload-artifact@v4
        with:
          name: MWTogether-${{ steps.ver.outputs.version }}
          path: dist/MWTogether-${{ steps.ver.outputs.version }}.zip

      - name: Release
        if: github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          # always a normal release marked latest (no pre-releases); same asset name as tools\release.ps1, so README can link releases/latest/download/MWTogether.zip
          cp "dist/MWTogether-$v.zip" dist/MWTogether.zip
          gh release create "v$v" dist/MWTogether.zip --title "NFS MW Together $v" --notes-file "dist/MWTogether-$v-notes.md" --generate-notes --target "${{ github.sha }}" --latest
