; NFS MW Together (MWT) settings - lives in the game's scripts\ folder
; Your name in co-op is the name of the career profile you play (there is no setting for it).

[Network]
; host = wait for the other player; client = connect to HostIP
Mode=host
; Host's IP address (LAN IP, or Radmin VPN / ZeroTier IP). Client only.
HostIP=127.0.0.1
; Host only, optional: the client's IP. The host then also sends to the client, so
; neither PC needs a firewall rule on a LAN / VPN. Leave empty to just wait.
ClientIP=
; UDP port (both sides use it). Over the internet without a VPN, the host must
; forward it on the router.
Port=47555
; State packets per second
SendRate=60
; 1 = host / join again by itself on the next start, as last time ("Reconnect on launch" in the
; game's Together menu); 0 = the game stops at the main menu and asks (Together icon: Host / Join)
AutoConnect=1

[Ghost]
; Remote cars are shown this many ms in the past, interpolated between packets
; (smooth). Lower = less delay, more extrapolation when packets are late.
InterpDelayMs=100
; Show the other player's car in your world
Enabled=1
; Show what the other player's car is doing: front wheels, lights, nitrous (0/1)
SyncControls=1
; Show the other player's car damage: dents, broken parts and lights (0/1)
SyncDamage=1
; The other player's car collides (0/1): you bounce off it, and the traffic / cops /
; racers of the PC that owns them get pushed by it (each PC pushes its own cars).
; Collisions stay off at a race start, after a teleport, and while packets are late,
; and come back on once the two cars' collision boxes (plus a 25% margin) no longer overlap.
Collisions=1

[Traffic]
; Shared traffic: the host's traffic is mirrored on the client while the players
; are within ~350 m of each other (the client's own traffic is switched off there).
Sync=1
; Driver class for mirrored cars: 4 = none (no AI), 6 = remote player
MirrorClass=4
; Shared traffic inside races too (client side, 0/1). The client's own traffic cars follow the host's
; traffic cars (none are removed: race scripts own some of them). 0 = each player keeps their own
; traffic during a race
SharedInRaces=1
; Smooth handover (client side, 0/1): when you drive away from the host, the host's cars around
; you don't vanish - they drive on as your own traffic. When you come back, your own traffic cars stay
; until they are out of view, and the host's cars only appear where you can't see it happen (behind
; you or far away) or take over one of your nearby cars. 0 = the old instant switch
SmoothHandover=1
; No cars popping up in front of a player (0/1, both PCs): the game never puts a new traffic car or
; cop within ~60 m in front of the OTHER player either (it picks another spot), and a copy of the
; other player's car (traffic, their cops) never appears inside your view within ~60 m - it waits until
; it is out of view or farther away. 0 = cars may appear anywhere, as before
NoSpawnNearPlayers=1
; Cars in the world (20..64, both PCs): the game allows 20; the room above that is for copies of the
; other player's cars (traffic, cops, roadblocks), so neither game has to delete its own cars for them.
; The game's car tables and lists are sized from this. More cars cost frame rate.
MaxCars=40

[Career]
; When either player finishes an event first, both get the win (cash, unlocks, career progress)
SharedWins=1
; When either player completes a milestone (pursuit length, bounty, cost to state, speed trap...) the
; other player gets it too, with its reward, if their career is at the same Blacklist rival
SharedMilestones=1

[Start]
; The mod writes the profile loaded last here; empty = none remembered yet
LastProfile=

[Coop]
; Speedbreaker (slow motion) can't work with two players: keep it off and empty
NoSpeedbreaker=1
; While connected, opening the pause menu or the map doesn't stop the world (the other player keeps playing)
NoPause=1
; Keep the game running when its window isn't focused (alt-tab)
RunInBackground=1
; Also load the world around the other player, so cars near them keep full physics and collisions
StreamAroundPeer=1
; Keep the loading screen up until the other player has loaded too (up to 30 s), then the intro
; cutscene starts on both together; what is left is evened out on the grid (up to 20 s)
StartTogether=1
; Both games put their own player on the same grid slot: the client moves to the slot its game
; gave the host, so the two cars stand apart on both screens from the countdown on (0/1)
SeparateGridSlots=1
; Co-op already in the prologue: both of you play its races together, the one who is ahead waits on
; the grid of the next one. Needs this version on both PCs (0 = co-op starts after the prologue)
Prologue=1
; AI opponents pace themselves against whichever player is ahead (0 = against the host only)
CatchUpLeader=1
; The same AI opponents every time you start or restart an event - names, cars and tuning - also on a new
; save. The first time an event is raced its opponents are kept (MWTogether-opponents.bin) (0 = random as in the plain game)
FixedOpponents=1
; Blacklist rival races together get one more AI racer on the rival's side, with the usual racing AI:
; one more car to beat. Its car is the partner the rival's race intro shows, where there is one (0/1)
BossHelper=1
; Rival races together: the other player races in a racer slot of their own (grid slot, standings, finish), as in other races (0/1)
PartnerInRivalRaces=1
; Slow-motion moments while connected (speed traps, pursuit start / crash / finish cameras): 0 = as in the plain game (default),
; 1 = none, everything in real time (0/1)
NoSlowMotion=0
; The other player sees the host's weather (rain, wet roads) (0/1)
SyncWeather=1
; When the other player starts a Blacklist pursuit (milestone / bounty) and is moved there, your car is taken along (0/1)
FollowToPursuits=1
; Police in free roam are shared (0/1): heat goes to the hotter of you two, busting one busts both,
; the cooldown only fills once both of you are in it and you escape together (also when you're both in
; the same event, e.g. a Challenge Series pursuit), the other player's
; cops show on your minimap and radar detector, and ramming one of their cops starts a pursuit on you.
; 0 = each of you has your own heat and pursuit
SharedPursuits=1
; Story scenes outside events (Blacklist rival movies, story movies, story cutscenes in the world):
; 0 = each game on its own, 1 = while one of you watches one, the other game waits (the world stops),
; and a movie you both watch is skipped only when both press skip, 2 = as 1, and a story movie also
; plays on the other game when its career has got that far
SyncStoryScenes=1

[UI]
; 0 = first start: the game asks Host / Join in the main menu (Together icon) - or opens the page if
; the game's menus couldn't get the Together entries; choosing sets 1
TogetherSetupDone=0
; Notices (player joined / left ...) in the game's own message line in the centre of the screen, green, or
; orange for a problem (in cutscenes and menus: the song-title banner). 0 = no notices
GameNotices=1
; How many seconds a notice stays on screen (2-60); a notice in parts shares them (at least 3 s a part)
NoticeSeconds=10
; Key that hides / shows the minimap (with the heat meter) and the speedometer - the rear-view mirror stays. 112 = F1, 0 = off
HideHudKey=112
; A chevron in your partner's car colour over their car (at the screen edge when off screen). 0 = off
FriendMarker=1

[Window]
; Hide the Windows mouse arrow over the game (the game draws its own cursor)
HideCursor=1
; Dev builds only (ignored in a release): start without taking the focus; the game can boot
; in the background and stays muted until you click it (0/1)
StartInBackground=0

[Input]
; Detect a gamepad / wheel connected while the game runs (USB or Bluetooth), and one that was
; disconnected and connected again: the game picks it up as if it had been there at start (0/1)
GamepadHotplug=1
; Keep your controller bindings when the game starts without the pad. Without this the game resets
; the pad's bindings to the defaults and the next autosave stores that (0/1)
KeepPadBindings=1

[Debug]
; Show the status overlay (F8 toggles it; the choice is saved here)
Overlay=0
ToggleKey=0x77
; Test keys: F5 autopilot (the game's AI drives your car; again = you drive), F7 start the test event,
; F10 spawns a test car (the other player's last car, or a copy of yours), F11 removes it
TestKeys=0
; Dev builds only (ignored in a release): the AI drives your car in free roam and races (F5 switches it off/on)
AutoPilot=0
; The autopilot uses nitrous on straights (0/1)
AutoPilotNos=1
; Performance diagnostics: fps, frame times and the mod's own cost, logged every 5 s (0/1)
Perf=0
; Log what the profile (memory card) screens do while the game boots (0/1)
BootTrace=0
; Dev builds only (ignored in a release): UDP network simulator, applied to send and receive.
; Delay in milliseconds, jitter +/- ms around that delay, loss / duplicate / reorder as 0-100 percent.
NetDelayMs=0
NetJitterMs=0
NetLossPercent=0
NetDuplicatePercent=0
NetReorderPercent=0
